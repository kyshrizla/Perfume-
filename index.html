<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfume Access</title>
<style>
:root{--bg:#f7f5f1;--card:#fff;--ink:#181818;--muted:#777;--line:#e7e2da;--accent:#171717;--soft:#efebe5}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}.app{max-width:1100px;margin:auto;min-height:100vh}.top{padding:18px 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);position:sticky;top:0;z-index:5}
.brand{font-weight:800;font-size:20px}.tag{font-size:12px;color:var(--muted);margin-top:3px}
.hero{padding:48px 20px 28px}.hero h1{font-size:clamp(34px,7vw,62px);line-height:.98;margin:0 0 14px;max-width:720px;letter-spacing:-2px}.hero p{color:var(--muted);font-size:16px;max-width:620px}
.search{display:flex;gap:8px;margin-top:24px}.search input{flex:1;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:white}.btn{border:0;border-radius:11px;padding:12px 16px;background:var(--accent);color:#fff;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--ink)}
.section{padding:18px 20px}.section h2{font-size:21px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;cursor:pointer}.pic{height:190px;background:#eee8df;display:grid;place-items:center;color:#999;font-size:13px}.cardbody{padding:14px}.name{font-weight:750}.brand2,.meta{font-size:12px;color:var(--muted);margin-top:4px}.price{font-weight:750;margin-top:12px}.tiny{font-size:11px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;padding:5px 8px;border-radius:999px;background:var(--soft);margin-top:8px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.pic{height:160px}}
@media(max-width:480px){.hero{padding-top:34px}.grid{gap:10px}.pic{height:150px}.search{flex-direction:column}}
.detail{display:none;padding:24px 20px 50px}.back{margin-bottom:18px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px}.detailpic{min-height:390px;background:#eee8df;border-radius:18px;display:grid;place-items:center;color:#999}.detail h1{font-size:42px;line-height:1;margin:0}.community{font-size:28px;font-weight:800;margin-top:22px}.perml{font-size:13px;color:var(--muted)}.action{margin-top:18px;width:100%}.drop{display:none;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#fff;overflow:hidden}.size{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;cursor:pointer}.size:last-child{border:0}.panel{margin-top:22px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:14px}.form{display:none;margin-top:12px}.form input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:5px 0 8px}.note{font-size:12px;color:var(--muted);line-height:1.5}
@media(max-width:700px){.detailgrid{grid-template-columns:1fr}.detailpic{min-height:280px}.detail h1{font-size:34px}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#171717;color:#fff;padding:12px 16px;border-radius:10px;display:none;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">Perfume Access</div><div class="tag">Access the fragrance in the quantity you actually want.</div></header>

<main id="home">
<section class="hero">
<h1>What do you want to smell?</h1>
<p>We turn individual fragrance curiosity into collective purchasing power.</p>
<div class="search"><input id="search" placeholder="Search a fragrance or brand…" oninput="render()"><button class="btn" onclick="requestFragrance()">Request fragrance</button></div>
</section>

<section class="section"><h2>Almost Unlocked</h2><div class="grid" id="almost"></div></section>
<section class="section"><h2>Community Picks</h2><div class="grid" id="popular"></div></section>
<section class="section"><h2>Recently Requested</h2><div class="grid" id="requested"></div></section>
</main>

<section class="detail" id="detail"></section>
</div>
<div class="toast" id="toast"></div>

<script>
const perfumes=[
{name:"Bois Imperial",brand:"Essential Parfums",mode:"Community Funded",size:100,source:190000,community:200000,committed:76,interested:147,bought:38,sizes:[1,2,5,10]},
{name:"Liquid Brun",brand:"French Avenue",mode:"Platform Funded",size:100,source:70000,community:80000,committed:100,interested:91,bought:42,sizes:[1,2,5,10]},
{name:"Hacivat",brand:"Nishane",mode:"Community Funded",size:50,source:370000,community:385000,committed:31,interested:112,bought:25,sizes:[1,2,5]},
{name:"Sauvage Elixir",brand:"Dior",mode:"Platform Funded",size:60,source:491780,community:505000,committed:60,interested:88,bought:51,sizes:[1,2,5,10]},
{name:"Bleu de Chanel",brand:"Chanel",mode:"Community Funded",size:100,source:345000,community:360000,committed:64,interested:102,bought:35,sizes:[1,2,5,10]},
{name:"Oud for Greatness",brand:"Initio",mode:"Community Funded",size:90,source:420000,community:435000,committed:53,interested:96,bought:29,sizes:[1,2,5,10]},
{name:"Eros",brand:"Versace",mode:"Platform Funded",size:100,source:180000,community:190000,committed:100,interested:75,bought:33,sizes:[1,2,5,10]},
{name:"Imagination",brand:"Louis Vuitton",mode:"Community Funded",size:100,source:520000,community:535000,committed:44,interested:139,bought:21,sizes:[1,2,5,10]}
];
let selected=null;
const naira=n=>new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:0}).format(n);

function card(p){
return `<article class="card" onclick="openDetail('${p.name}')"><div class="pic">Fragrance image</div><div class="cardbody"><div class="name">${p.name}</div><div class="brand2">${p.brand}</div><span class="badge">${p.mode}</span><div class="price">${naira(p.community)} <span class="tiny">· ${naira(Math.round(p.community/p.size))}/ml</span></div><div class="meta">${p.committed}/${p.size} ml committed · ${p.interested} interested</div></div></article>`
}
function render(){
let q=document.getElementById("search").value.toLowerCase();
let list=perfumes.filter(p=>(p.name+" "+p.brand).toLowerCase().includes(q));
let almost=[...list].filter(p=>p.mode==="Community Funded").sort((a,b)=>(b.committed/b.size)-(a.committed/a.size)).slice(0,4);
let popular=[...list].sort((a,b)=>b.bought-a.bought).slice(0,4);
let req=[...list].sort((a,b)=>b.interested-a.interested).slice(0,4);
document.getElementById("almost").innerHTML=almost.map(card).join("");
document.getElementById("popular").innerHTML=popular.map(card).join("");
document.getElementById("requested").innerHTML=req.map(card).join("");
}
function openDetail(name){
selected=perfumes.find(p=>p.name===name);
document.getElementById("home").style.display="none";
let d=document.getElementById("detail");d.style.display="block";
d.innerHTML=`
<button class="btn secondary back" onclick="goHome()">← Back</button>
<div class="detailgrid">
<div class="detailpic">Admin-uploaded fragrance information / notes image</div>
<div>
<span class="badge">${selected.mode}</span>
<h1>${selected.name}</h1><div class="brand2">${selected.brand}</div>
<div class="community">${naira(selected.community)} <span class="perml">· ${naira(Math.round(selected.community/selected.size))}/ml</span></div>
<button class="btn action" onclick="toggleDrop()">Get Decant ▾</button>
<div class="drop" id="drop">${selected.sizes.map(s=>`<div class="size" onclick="chooseSize(${s})"><span>${s} ml</span><span>${naira(Math.round(selected.community/selected.size*s))} + ${naira(bottleCost(s))} bottle</span></div>`).join("")}</div>
<button class="btn secondary action" onclick="buyFull()">Buy Full Bottle</button>
<div class="panel"><b>Community demand</b><div class="meta">${selected.committed}/${selected.size} ml committed · ${selected.interested} interested · ${selected.bought} bought</div></div>
<div class="panel"><b>Interest</b><div class="note">Curious but not ready to commit? Register your interest. No account or purchase obligation.</div><button class="btn secondary action" onclick="showInterest()">I'm Interested</button><div class="form" id="interestForm"><input id="iname" placeholder="Your name"><input id="contact" placeholder="WhatsApp or X username"><input id="qty" type="number" placeholder="Desired quantity (ml)"><button class="btn action" onclick="submitInterest()">Submit interest</button></div></div>
</div></div>`;
}
function bottleCost(s){return s<=1?200:s<=2?300:s<=5?500:700}
function toggleDrop(){let x=document.getElementById("drop");x.style.display=x.style.display==="block"?"none":"block"}
function chooseSize(s){
if(selected.mode==="Community Funded"){
if((selected.committed/selected.size)<1) showToast(`${s} ml selected. Commitment flow would open next.`);
else showToast(`${s} ml is available. Payment/fulfilment flow would open next.`);
}else showToast(`${s} ml selected. Instant platform-funded purchase flow would open next.`);
}
function showInterest(){document.getElementById("interestForm").style.display="block"}
function submitInterest(){showToast("Interest recorded for this prototype.");}
function buyFull(){showToast("Full-bottle purchase flow would open next.");}
function requestFragrance(){showToast("Fragrance request flow would open next.");}
function goHome(){document.getElementById("detail").style.display="none";document.getElementById("home").style.display="block";window.scrollTo(0,0)}
function showToast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}
render();
</script>
</body></html>
